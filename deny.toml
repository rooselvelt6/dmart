# cargo-deny configuration for dMart UCI
# SPEC-011 / F1.7 — Política de dependencias: licencias + advisories

[advisories]
# Base de datos de vulnerabilidades: RustSec
db-urls = ["https://github.com/RustSec/advisory-db.git"]
db-path = "advisory-db"
# Ignorar advisories específicos si son falsos positivos y están documentados
# Unmaintained transitive dependencies (no direct security vulns, monitoring for alternatives)
# `cargo audit` no lee este archivo: el job de Security Audit extrae los
# IDs de aquí y se los pasa con `--ignore`, así que la lista vive en un
# único sitio.
ignore = [
    "RUSTSEC-2024-0370",  # proc-macro-error unmaintained (via utoipa-gen -> utoipa -> utoipa-swagger-ui)
    "RUSTSEC-2026-0173",  # proc-macro-error2 unmaintained (via leptos_macro -> leptos)
    "RUSTSEC-2025-0141",  # bincode unmaintained (via surrealdb)
    "RUSTSEC-2021-0153",  # encoding unmaintained (via surrealdb)
    "RUSTSEC-2024-0384",  # instant unmaintained (via surrealdb)
    "RUSTSEC-2024-0436",  # paste unmaintained (via surrealdb)
    "RUSTSEC-2023-0089",  # atomic-polyfill unmaintained (via heapless, target embebido)
    "RUSTSEC-2025-0119",  # number_prefix unmaintained (via indicatif -> tokenizers -> candle)
    # lru 0.12.5: `IterMut` viola Stacked Borrows. Vía surrealkv ->
    # surrealdb-core -> surrealdb. dmart no usa `LruCache` directamente;
    # pendiente de resolver subiendo surrealdb a una versión con `lru` parcheado.
    "RUSTSEC-2026-0002",
    # lru 0.12.5: `LruCache::pop()` sin panic safety (posible use-after-free).
    # Misma cadena de dependencias; ver RUSTSEC-2026-0002.
    "RUSTSEC-2026-0253",
]

[licenses]
# Licencia permitida: lista de licencias SPDX aprobadas
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "BUSL-1.1",
]
# Copyleft licenses are denied by default in newer cargo-deny

[bans]
# Crates prohibidos (ej: versiones con vulnerabilidades conocidas, unmaintained)
deny = []
# Versiones múltiples del mismo crate (evita duplicados en el árbol)
multiple-versions = "warn"

[sources]
# Permitir solo crates.io y git sources de confianza
unknown-registry = "deny"
unknown-git = "deny"

[graph]
# Configuración del grafo de dependencias
targets = []
features = []
all-features = true
no-default-features = false
exclude-dev = false
exclude = []