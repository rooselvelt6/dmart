# Prometheus scrapes config — dMart UCI
# Servidor: http://dmart-server:8080 trabajando en local, exposición en
# docker-compose bajo el host `dmart-server` (override con --web.config opcional).
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 1m

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "rules/alerts-critical.yml"
  - "rules/alerts-auth-security.yml"
  - "rules/alerts-clinical-ml.yml"
  - "rules/alerts-ingest-hl7.yml"
  - "rules/alerts-operational.yml"

scrape_configs:
  - job_name: dmart-server
    metrics_path: /obs/metrics
    scheme: http
    # SPEC-005 edge case #2: métricas de alta cardinalidad (p.ej. user_id en
    # labels) se rechazan en el ingest. El server ya ACOTA labels a
    # method/status/route/escala/result, esto es defensa en profundidad.
    label_limit: 30
    label_name_length_limit: 200
    label_value_length_limit: 200
    sample_limit: 5000
    static_configs:
      - targets: ["dmart-server:8080"]
        labels:
          service: dmart
          env: production
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Node exporter para métricas de sistema (disk, cpu, mem) — SPEC-008/009
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]