<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema UCI — Unidad de Cuidados Intensivos. Gestión de escalas Apache II y Glasgow, registro de pacientes y monitoreo en tiempo real." />
    <meta name="theme-color" content="#0B1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>UCI — Sistema de Cuidados Intensivos</title>

    <!-- PWA: manifest + service worker (copiados al dist por Trunk) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-file" href="icon.svg" />

    <!-- Tailwind CSS (Compilado vía Trunk nativamente, sin NodeJS en runtime) -->
    <link data-trunk rel="tailwind-css" href="input.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <div id="root"></div>

    <!-- Leptos WASM entry point (generated by trunk) -->
    <link data-trunk rel="rust" data-bin="dmart-app" />

    <!-- Registro del service worker para PWA Offline -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(function (err) {
                console.warn('[UCI] No se pudo registrar el service worker:', err);
            });
        }
    </script>
</body>
</html>
