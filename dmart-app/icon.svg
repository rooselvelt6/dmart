<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <radialGradient id="cross-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="heart-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo circular limpio -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Anillo exterior sutil -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#16a34a" stroke-width="3" opacity="0.3"/>

  <!-- Cruz médica principal - verde salud -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <rect x="-24" y="-80" width="48" height="160" rx="12" fill="url(#cross-gradient)"/>
    <rect x="-80" y="-24" width="160" height="48" rx="12" fill="url(#cross-gradient)"/>
    
    <!-- Corazón en el centro de la cruz -->
    <path d="M0,-10 C-12,-20 -12,-30 0,-20 C12,-30 12,-20 0,-10 Z" 
          fill="url(#heart-gradient)" opacity="0.95">
      <animate attributeName="transform" values="scale(1);scale(1.08);scale(1)" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Anillo de vida -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.3" stroke-dasharray="8 12">
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="40s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulso vital (EKG) -->
  <path d="M-120,0 Q-90,-30 -60,0 Q-30,30 0,0 Q30,-30 60,0 Q90,-30 120,0" 
        fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="600" to="0" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Texto DM -->
  <text x="256" y="440" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#16a34a" text-anchor="middle" letter-spacing="3" opacity="0.85">DM</text>
</svg>