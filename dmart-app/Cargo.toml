[package]
name = "dmart-app"
version = "0.1.1"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dmart-shared = { path = "../dmart-shared", features = ["wasm-time"] }

# Leptos 0.8 - Full-stack reactive framework
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
console_error_panic_hook = "0.1"

# Global executor for spawn_local (fixes "no global spawn_local configured")
any_spawner = { version = "0.3", features = ["wasm-bindgen"] }

# HTTP client (WASM)
gloo-net = { version = "0.7", features = ["http"] }
gloo-storage = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }

# Randomness for WASM
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }

# WASM
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement",
    "Event", "InputEvent", "MouseEvent", "Location",
    "Blob", "Url", "HtmlAnchorElement",
    "EventSource", "MessageEvent",
    "MediaQueryList",
    "RequestCredentials",
    "console",
    # SPEC-052: Web Push (suscripción del navegador vía Service Worker).
    "Navigator",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "PushManager",
    "PushSubscription",
    "PushSubscriptionOptionsInit",
    "PushEncryptionKeyName",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# i18n - simple key-value translation (no fluent needed)

# Random for toast IDs
rand = { version = "0.8", features = ["getrandom"] }

# For Lazy static initialization
once_cell = "1.19"

[dev-dependencies]
wasm-bindgen-test = "0.3"
