[package]
name = "dmart-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "dmart-server"
path = "src/main.rs"

[lib]
name = "dmart_server"
path = "src/lib.rs"

[dependencies]
dmart-shared = { path = "../dmart-shared", features = ["chrono"] }

# Web framework
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
cel = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "set-header"] }
futures-util = "0.3"

# Database
surrealdb = { version = "2", features = ["kv-surrealkv"] }

# Cache
redis = { version = "0.27", features = ["aio", "tokio-comp"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
uuid = { workspace = true }

# Export
printpdf = { version = "0.12", default-features = false, features = [] }
csv = "1.3"
qrcode = "0.14"
image = "0.25"

# Filesystem (SPEC-030: statvfs para el chequeo de disco crítico de retención)
libc = "0.2"

# Stats (naive forecaster cuantiles normales)
statrs = "0.17"

# Environment
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.25"

# Metrics & Observability
metrics = "0.22"
metrics-exporter-prometheus = { version = "0.13", default-features = false, features = ["hyper", "tokio"] }
metrics-process = "2"

# OpenTelemetry (solo SDK para métricas/traces locales)
opentelemetry = { version = "0.25", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.25", features = ["metrics", "trace"] }
opentelemetry-semantic-conventions = "0.25"

# Health & Graceful Shutdown
axum-health = "0.1"

# Cryptography
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
ring = "0.17"
# Comparación en tiempo constante de secretos (handshake MLLP). Ya estaba en el
# grafo como dependencia transitiva; se declara explícita para el uso directo.
subtle = "2.6"
# AES-256-GCM para PHI en reposo, por requirement del proyecto y por su
# aceleración por hardware (AES-NI). OJO: este crate NO implementa un módulo
# validado FIPS 140-3; si el requisito normativo lo fuera, habría que sustituirlo
# por un proveedor con módulo validado (p. ej. openssl/rustls-fips).
aes-gcm = "0.10"

# JWT Authentication
jsonwebtoken = "9"

# TOTP multi-factor authentication
totp-rs = { version = "5", default-features = false, features = ["otpauth", "gen_secret"] }

# Argon2 password hashing (HIPAA compliant)
argon2 = "0.5"

# HTTP Client (sidecar calls, forecasting)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# OpenAPI / utoipa
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "5", default-features = false, features = ["axum"] }
# utoipa-axum is not needed separately, utoipa includes axum integration
serde_yaml = "0.9"

# Async traits
async-trait = "0.1"

# Concurrent hashmap for device states (SPEC-031)
dashmap = "5"
# ─── mTLS del listener HL7/MLLP (SPEC-052, auditoría H3) ──────────────────
# TLS 1.3 únicamente (sin `tls12`): sin cifrados de generaciones anteriores y
# sin renegociación. `ring` como provider para no arrastrar aws-lc/CMake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
totp-rs = { version = "5", default-features = false, features = ["otpauth"] }
proptest = "1.4"
serde_json = "1.0"
rcgen = "0.13"
