apiVersion: v1
kind: Service
metadata:
  name: dmart-server-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dmart.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dmart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
