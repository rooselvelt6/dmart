apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dmart-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dmart.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "dmart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
