{{- if .Values.surrealdb.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: surrealdb-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dmart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dmart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "dmart.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
      ports:
        - port: 8000
          protocol: TCP
{{- end }}
