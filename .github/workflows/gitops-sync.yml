name: gitops-sync

on:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify Helm and Dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Lint
        run: helm lint ./helm/dmart

      - name: Helm Template
        run: |
          helm template dmart ./helm/dmart --namespace dmart > /dev/null

      - name: Validate Dataset
        run: |
          if [ -d datasets ]; then
            echo "Datasets directory found, validating JSON files..."
            find datasets -name "*.json" -exec python3 -m json.tool {} \; > /dev/null
          else
            echo "No datasets directory found, skipping."
          fi
