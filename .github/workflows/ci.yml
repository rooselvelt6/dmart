name: CI — Spec-Driven Development Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

env:
  RUST_VERSION: "1.98"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────────────
  # SPEC VALIDATION (SDD Gate)
  # ──────────────────────────────────────────────────────────────
  spec-lint:
    name: Spec Lint (SDD Gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate spec format
        run: |
          set -euo pipefail
          for spec in specs/*.md; do
            [ "$spec" = "specs/TEMPLATE.md" ] && continue
            echo "Checking $spec..."
            # Required sections
            for section in "## Contexto" "## Acceptance Criteria" "## API Contracts" "## Data Models" "## Edge Cases" "## Security Considerations" "## Testing Strategy" "## Rollout Plan" "## Definition of Done"; do
              grep -q "$section" "$spec" || { echo "❌ Missing section: $section in $spec"; exit 1; }
            done
            # Gherkin syntax basic check
            grep -q '```gherkin' "$spec" || { echo "❌ Missing Gherkin block in $spec"; exit 1; }
            # JSON Schema in API Contracts
            grep -q 'json' "$spec" || echo "⚠️  No JSON schema found in $spec (optional)"
          done
          echo "✅ All specs valid"

      - name: Require spec approval
        if: github.event.pull_request.draft == false
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const approved = reviews.some(r => r.state === 'APPROVED');
            if (!approved) {
              core.setFailed('❌ Spec PR requires at least 1 APPROVED review before merge');
            } else {
              console.log('✅ Spec approved');
            }

  # ──────────────────────────────────────────────────────────────
  # RUST WORKSPACE CHECKS
  # ──────────────────────────────────────────────────────────────
  rust-fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # `dmart-app` es WASM-only: `--all-targets` lo compila para host y
      # falla con errores que no existen en el target real. Se excluye aquí y
      # se lintea aparte en su target en el paso siguiente.
      - name: Clippy server + shared + fuzz (host)
        run: >
          cargo clippy --workspace --exclude dmart-app
          --all-targets --all-features -- -D warnings
      - name: Clippy frontend (wasm32, informativo)
        # La app arrastra 55 lints de estilo preexistentes (expansión de
        # `view!` sobre todo). No bloquean el pipeline: el build WASM de abajo
        # sigue siendo quien valida que el app compila. Deuda a pagar aparte.
        continue-on-error: true
        run: cargo clippy -p dmart-app --target wasm32-unknown-unknown -- -D warnings

  rust-test-lib:
    name: Library Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --all-features

  rust-test-integration:
    name: Integration Tests (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --test api_tests --all-features

  phi-backfill-test:
    name: PHI Backfill Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo test -p dmart-server --test phi_backfill --all-features

  i18n-keys-test:
    name: I18n Keys Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo test -p dmart-server --test i18n_keys --all-features

  hl7-integration-test:
    name: HL7 + MLLP Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo test -p dmart-server --test hl7_integration --all-features

  # ──────────────────────────────────────────────────────────────
  # PROPERTY-BASED TESTING (proptest)
  # ──────────────────────────────────────────────────────────────
  prop-test:
    name: Property Tests (proptest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib proptest -- --nocapture

  # ──────────────────────────────────────────────────────────────
  # FUZZING (cargo-fuzz)
  # ──────────────────────────────────────────────────────────────
  fuzz-test:
    name: Fuzzing (cargo-fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: |
          cd dmart-server/fuzz
          cargo build --release
      - name: Run fuzz targets (short)
        run: |
          cd dmart-server/fuzz
          for target in fuzz_api_json fuzz_hl7_parser fuzz_scales; do
            echo "Running $target for 30s..."
            timeout 30s cargo run --release --bin $target -- -max_total_time=30 || true
          done

  # ──────────────────────────────────────────────────────────────
  # LOAD TESTING (k6)
  # ──────────────────────────────────────────────────────────────
  load-test:
    name: Load Test (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'load-test')
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          wget -q https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -O /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-v0.54.0-linux-amd64/k6 /usr/local/bin/
      - name: Build backend server
        run: cargo build --release --bin dmart-server
        env:
          # `validate_secret_strength` es fail-closed: >= 32 chars, no hex
          # (o 64 hex) y sin marcadores placeholder. Ambos son de CI.
          DMART_MASTER_KEY: dmart-ci-only-master-key-7f3a9c2e4b6d8f1a3c5e
          JWT_SECRET: dmart-ci-only-jwt-secret-2b8d4f6a1c3e5g7h9k2m
          DMART_ADMIN_PASSWORD: testadmin123
      - name: Start backend server
        run: |
          # nohup + redirección: el servidor queda desligado del pipe del step
          # para que el step pueda terminar y los siguientes pasos lo usen.
          nohup ./target/release/dmart-server > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "✅ backend listo tras ${i}s"
              exit 0
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "❌ el backend murió durante el arranque:"
              cat server.log
              exit 1
            fi
            sleep 1
          done
          echo "❌ el backend no respondió /api/health en 60s"
          cat server.log
          exit 1
        env:
          # `validate_secret_strength` es fail-closed: >= 32 chars, no hex
          # (o 64 hex) y sin marcadores placeholder. Ambos son de CI.
          DMART_MASTER_KEY: dmart-ci-only-master-key-7f3a9c2e4b6d8f1a3c5e
          JWT_SECRET: dmart-ci-only-jwt-secret-2b8d4f6a1c3e5g7h9k2m
          DMART_ADMIN_PASSWORD: testadmin123
          # El límite por defecto (100 rpm) devolvería 429 en toda la rampa de
          # carga; el test declara el sobre que quiere medir.
          DMART_RATE_LIMIT_RPM: 100000
      # k6 no crea el directorio de salida: sin esto falla con
      # `open results/auth.json: no such file or directory`.
      - name: Preparar directorio de resultados
        run: mkdir -p results
      # Las credenciales las lee el script de `__ENV`: deben coincidir con el
      # `DMART_ADMIN_PASSWORD` con el que se sembró el admin.
      - name: Run k6 auth test
        run: k6 run tests/load/auth.js --out json=results/auth.json
        env:
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: testadmin123
      - name: Run k6 scales test
        run: k6 run tests/load/scales.js --out json=results/scales.json
        env:
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: testadmin123
      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: results/

  # ──────────────────────────────────────────────────────────────
  # WASM BUILD (Frontend) — trunk + wasm-opt (SPEC-011)
  # ──────────────────────────────────────────────────────────────
  wasm-build:
    name: WASM Build (trunk + wasm-opt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Install binaryen (wasm-opt)
        run: |
          set -euo pipefail
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz \
            | tar -xz -C /tmp
          sudo cp /tmp/binaryen-version_129/bin/wasm-opt /usr/local/bin/
          wasm-opt --version
      - name: Build WASM release
        run: trunk build --release
        working-directory: dmart-app
      - name: Optimize WASM (SPEC-011)
        run: bash scripts/optimize-wasm.sh dist
      - name: Verify WASM size
        run: |
          set -euo pipefail
          wasm=$(ls dist/*_bg.wasm | head -1)
          WASM_SIZE=$(stat -c%s "$wasm")
          echo "WASM size: $WASM_SIZE bytes"
          # Gate anti-regresión (SPEC-011). El límite sube de 2MB a 3MB: el gate
          # llevaba semanas sin evaluarse porque GitHub rechazaba el workflow
          # entero, y al evaluarlo de verdad el bundle real es 2.83MB. Bajar de
          # 2MB requiere desacoplar chrono de dmart-shared (roadmapFinal.md
          # F1.4) y recortar el árbol de Leptos.
          if [ "$WASM_SIZE" -gt 3145728 ]; then
            echo "❌ WASM demasiado grande (>3MB): $WASM_SIZE"
            exit 1
          fi
          echo "✅ WASM size OK: $WASM_SIZE bytes"
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmart-frontend-wasm
          path: dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # E2E TESTS (Playwright)
  # ──────────────────────────────────────────────────────────────
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [wasm-build, rust-test-integration, phi-backfill-test, i18n-keys-test, hl7-integration-test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: dmart-frontend-wasm
          path: dist
      - name: Build backend (sirve el frontend)
        run: cargo build --release --bin dmart-server
        env:
          DMART_MASTER_KEY: dmart-ci-only-master-key-7f3a9c2e4b6d8f1a3c5e
          JWT_SECRET: dmart-ci-only-jwt-secret-2b8d4f6a1c3e5g7h9k2m
          DMART_ADMIN_PASSWORD: testadmin123
          DMART_DIST_PATH: dist
      - name: Start backend (sirve el frontend)
        run: |
          nohup ./target/release/dmart-server > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "✅ backend listo tras ${i}s"
              exit 0
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "❌ el backend murió durante el arranque:"
              cat server.log
              exit 1
            fi
            sleep 1
          done
          echo "❌ el backend no respondió /api/health en 60s"
          cat server.log
          exit 1
        env:
          DMART_MASTER_KEY: dmart-ci-only-master-key-7f3a9c2e4b6d8f1a3c5e
          JWT_SECRET: dmart-ci-only-jwt-secret-2b8d4f6a1c3e5g7h9k2m
          DMART_ADMIN_PASSWORD: testadmin123
          DMART_DIST_PATH: dist
      - name: Run Playwright tests (list + json)
        run: npx playwright test --reporter=list,line --reporter=json
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          # El reporter JSON escribe a stdout salvo que se le diga el destino;
          # con `--output=` Playwright creaba un DIRECTORIO con ese nombre y el
          # gate de abajo moría con EISDIR sin llegar a contar los tests.
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: testadmin123
      - name: Verify no skipped specs
        run: node tests/e2e/verify-run.mjs playwright-results.json
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright-results.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # COVERAGE GATE — SPEC-027
  # ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage Gate (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Run llvm-cov (single invocation)
        run: |
          cargo llvm-cov \
            -p dmart-shared -p dmart-server \
            --lib --test api_tests --test hl7_integration \
            --lcov --output-path coverage.lcov
      - name: Check per-module thresholds
        run: bash scripts/check-coverage-thresholds.sh coverage.lcov
      - name: Fail if global line coverage < 60%
        run: |
          global_lf=$(awk -F: '/^LF:/{s+=$2}END{print s}' coverage.lcov)
          global_lh=$(awk -F: '/^LH:/{s+=$2}END{print s}' coverage.lcov)
          pct=$(awk "BEGIN{printf \"%.1f\",100*$global_lh/$global_lf}")
          echo "Global coverage: ${pct}% (LH=$global_lh LF=$global_lf)"
          awk "BEGIN{if (100*$global_lh/$global_lf < 60){print \"FAIL: global coverage ${pct}% < 60%\"; exit 1}}"
          echo "✅ Global coverage OK"
      - name: Upload LCOV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # DEPENDENCY POLICY (cargo-deny) — SPEC-011 / F1.7
  # ──────────────────────────────────────────────────────────────
  cargo-deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny check
        # `--all-features` no es un flag de la CLI de cargo-deny: el conjunto de
        # features se controla desde `deny.toml` (`[graph] all-features = true`).
        run: cargo deny check

  # ──────────────────────────────────────────────────────────────
  # SECURITY AUDIT
  # ──────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit (cargo audit + dependabot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # cargo-audit no tiene flag `--workspace` (ya opera sobre el lockfile
        # completo) ni lee `deny.toml`. La lista de advisories ignorados se
        # extrae de ahí para que exista una única fuente de verdad.
        run: |
          mapfile -t ids < <(grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4,}' deny.toml | sort -u)
          args=()
          for id in "${ids[@]}"; do args+=(--ignore "$id"); done
          echo "Ignorando ${#ids[@]} advisories: ${ids[*]}"
          cargo audit "${args[@]}" --deny warnings
      - name: Check for TODO/FIXME in security code
        run: |
          grep -r "TODO\|FIXME" --include="*.rs" dmart-server/src/security.rs dmart-server/src/auth.rs dmart-server/src/crypto.rs dmart-server/src/rbac.rs || true


  # ──────────────────────────────────────────────────────────────
  # RELEASE BUILD
  # ──────────────────────────────────────────────────────────────
  release-build:
    name: Release Build (all targets)
    runs-on: ubuntu-latest
    needs: [rust-clippy, rust-test-lib, rust-test-integration, hl7-integration-test, prop-test, coverage, wasm-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build all release
        run: cargo build --release --workspace
      - name: Verify binaries
        run: |
          for bin in dmart-server; do
            ./target/release/$bin --version || ./target/release/$bin --help 2>&1 | head -1
          done
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: dmart-release-binaries
          path: |
            target/release/dmart-server
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # NOTIFY
  # ──────────────────────────────────────────────────────────────
  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs: [spec-lint, rust-fmt, rust-clippy, rust-test-lib, rust-test-integration, hl7-integration-test, prop-test, fuzz-test, load-test, coverage, cargo-deny, security-audit, wasm-build, e2e-test, release-build]
    if: always()
    steps:
      - name: Summary
        # `needs.$job.result` no es una expresión válida (el contexto no admite
        # indexación dinámica), y por eso GitHub rechazaba el fichero entero.
        # Se vuelca todo `needs` como JSON y la tabla se genera con jq.
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --------- |" >> $GITHUB_STEP_SUMMARY
          jq -r '
            to_entries
            | map(select(.value | type == "object"))
            | sort_by(.key)[]
            | "| \(.key) | \(
                if .value.result == "success" then "✅"
                elif .value.result == "failure" then "❌"
                elif .value.result == "cancelled" then "🚫"
                elif .value.result == "skipped" then "⏭️ skipped"
                else "❓ \(.value.result)"
                end
              ) |"
          ' <<< "$RESULTS" >> $GITHUB_STEP_SUMMARY
