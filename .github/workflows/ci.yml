name: CI — Spec-Driven Development Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

env:
  RUST_VERSION: "1.98"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────────────
  # SPEC VALIDATION (SDD Gate)
  # ──────────────────────────────────────────────────────────────
  spec-lint:
    name: Spec Lint (SDD Gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate spec format
        run: |
          set -euo pipefail
          for spec in specs/*.md; do
            [ "$spec" = "specs/TEMPLATE.md" ] && continue
            echo "Checking $spec..."
            # Required sections
            for section in "## Contexto" "## Acceptance Criteria" "## API Contracts" "## Data Models" "## Edge Cases" "## Security Considerations" "## Testing Strategy" "## Rollout Plan" "## Definition of Done"; do
              grep -q "$section" "$spec" || { echo "❌ Missing section: $section in $spec"; exit 1; }
            done
            # Gherkin syntax basic check
            grep -q '```gherkin' "$spec" || { echo "❌ Missing Gherkin block in $spec"; exit 1; }
            # JSON Schema in API Contracts
            grep -q 'json' "$spec" || echo "⚠️  No JSON schema found in $spec (optional)"
          done
          echo "✅ All specs valid"

      - name: Require spec approval
        if: github.event.pull_request.draft == false
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const approved = reviews.some(r => r.state === 'APPROVED');
            if (!approved) {
              core.setFailed('❌ Spec PR requires at least 1 APPROVED review before merge');
            } else {
              console.log('✅ Spec approved');
            }

  # ──────────────────────────────────────────────────────────────
  # RUST WORKSPACE CHECKS
  # ──────────────────────────────────────────────────────────────
  rust-fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-test-lib:
    name: Library Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --all-features

  rust-test-integration:
    name: Integration Tests (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --test api_tests --all-features

  hl7-integration-test:
    name: HL7 + MLLP Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo test -p dmart-server --test hl7_integration --all-features

  # ──────────────────────────────────────────────────────────────
  # PROPERTY-BASED TESTING (proptest)
  # ──────────────────────────────────────────────────────────────
  prop-test:
    name: Property Tests (proptest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib proptest -- --nocapture

  # ──────────────────────────────────────────────────────────────
  # FUZZING (cargo-fuzz)
  # ──────────────────────────────────────────────────────────────
  fuzz-test:
    name: Fuzzing (cargo-fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: |
          cd dmart-server/fuzz
          cargo build --release
      - name: Run fuzz targets (short)
        run: |
          cd dmart-server/fuzz
          for target in fuzz_api_json fuzz_hl7_parser fuzz_scales; do
            echo "Running $target for 30s..."
            timeout 30s cargo run --release --bin $target -- -max_total_time=30 || true
          done

  # ──────────────────────────────────────────────────────────────
  # LOAD TESTING (k6)
  # ──────────────────────────────────────────────────────────────
  load-test:
    name: Load Test (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.labels.*.name contains 'load-test'
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          wget -q https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -O /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-v0.54.0-linux-amd64/k6 /usr/local/bin/
      - name: Start backend server
        run: |
          cargo run --release --bin dmart-server &
          sleep 10
          curl -f http://127.0.0.1:3000/api/health
        env:
          DMART_MASTER_KEY: test-master-key-32-bytes-long!!
          DMART_ADMIN_PASSWORD: testadmin123
      - name: Run k6 auth test
        run: k6 run tests/load/auth.js --out json=results/auth.json
      - name: Run k6 scales test
        run: k6 run tests/load/scales.js --out json=results/scales.json
      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: results/

  # ──────────────────────────────────────────────────────────────
  # WASM BUILD (Frontend) — cargo + wasm-bindgen (bypass trunk lightningcss/wasm-opt issues)
  # ──────────────────────────────────────────────────────────────
  wasm-build:
    name: WASM Build (cargo + wasm-bindgen)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli (pinned to 0.2.118 for compatibility)
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build WASM release
        run: |
          cd dmart-app
          cargo build --target wasm32-unknown-unknown --release
          wasm-bindgen --out-dir ../dist --target web ../target/wasm32-unknown-unknown/release/dmart_app.wasm
          # Copy static assets
          cp index.html ../dist/
          cp input.css ../dist/
          cp manifest.webmanifest ../dist/
          cp sw.js ../dist/
          cp icon.svg ../dist/
      - name: Verify WASM size
        run: |
          WASM_SIZE=$(stat -c%s dmart-app/dist/dmart_app_bg.wasm 2>/dev/null || stat -c%s dmart/dist/dmart_app_bg.wasm)
          echo "WASM size: $WASM_SIZE bytes"
          if [ $WASM_SIZE -gt 1048576 ]; then
            echo "❌ WASM too large (>1MB): $WASM_SIZE"
            exit 1
          fi
          echo "✅ WASM size OK: $WASM_SIZE bytes"
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmart-frontend-wasm
          path: dmart-app/dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # E2E TESTS (Playwright)
  # ──────────────────────────────────────────────────────────────
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [wasm-build, rust-test-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: dmart-frontend-wasm
          path: dmart-app/dist
      - name: Start backend
        run: |
          cargo run --release --bin dmart-server &
          sleep 10
          curl -f http://127.0.0.1:3000/api/health
        env:
          DMART_MASTER_KEY: test-master-key-32-bytes-long!!
          DMART_ADMIN_PASSWORD: testadmin123
      - name: Start frontend server
        run: |
          cd dmart-app/dist
          python3 -m http.server 8080 &
          sleep 3
      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080/dist
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # COVERAGE GATE — SPEC-027
  # ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage Gate (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run llvm-cov (single invocation)
        run: |
          cargo llvm-cov \
            -p dmart-shared -p dmart-server \
            --lib --test api_tests --test hl7_integration \
            --lcov --output-path coverage.lcov
      - name: Check per-module thresholds
        run: bash scripts/check-coverage-thresholds.sh coverage.lcov
      - name: Fail if global line coverage < 60%
        run: |
          global_lf=$(awk -F: '/^LF:/{s+=$2}END{print s}' coverage.lcov)
          global_lh=$(awk -F: '/^LH:/{s+=$2}END{print s}' coverage.lcov)
          pct=$(awk "BEGIN{printf \"%.1f\",100*$global_lh/$global_lf}")
          echo "Global coverage: ${pct}% (LH=$global_lh LF=$global_lf)"
          awk "BEGIN{if (100*$global_lh/$global_lf < 60){print \"FAIL: global coverage ${pct}% < 60%\"; exit 1}}"
          echo "✅ Global coverage OK"
      - name: Upload LCOV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # SECURITY AUDIT
  # ──────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit (cargo audit + dependabot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit --workspace --deny warnings
      - name: Check for TODO/FIXME in security code
        run: |
          grep -r "TODO\|FIXME" --include="*.rs" dmart-server/src/security.rs dmart-server/src/auth.rs dmart-server/src/crypto.rs dmart-server/src/rbac.rs || true

  # ──────────────────────────────────────────────────────────────
  # DOCKER BUILD (multi-stage, verifies image size + healthcheck)
  # ──────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [rust-clippy, rust-test-lib, rust-test-integration, hl7-integration-test, prop-test, wasm-build]
    if: github.event_name == 'push' || github.event.pull_request.labels.*.name contains 'docker-build'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: dmart-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image size
        run: |
          SIZE=$(docker images dmart-server:ci --format "{{.Size}}")
          echo "Image size: $SIZE"
          # Parse size (e.g., "52.3MB" -> 52.3)
          SIZE_MB=$(echo "$SIZE" | sed 's/[^0-9.]//g')
          if (( $(echo "$SIZE_MB > 60" | bc -l) )); then
            echo "❌ Image too large (>60MB): $SIZE"
            exit 1
          fi
          echo "✅ Image size OK: $SIZE"
      - name: Test healthcheck in container
        run: |
          CID=$(docker run -d -p 3000:3000 \
            -e DMART_MASTER_KEY=test-master-key-32-bytes-long!! \
            -e DMART_ADMIN_PASSWORD=testadmin123 \
            -e DMART_DB_PATH=/app/data/dmart.db \
            -e DMART_DIST_PATH=/app/dist \
            -e DMART_VALKEY_URL=redis://127.0.0.1:6379 \
            dmart-server:ci)
          sleep 15
          for i in {1..10}; do
            if curl -sf http://localhost:3000/obs/health | grep -q '"status":"healthy"'; then
              echo "✅ Healthcheck passed"
              docker stop $CID
              exit 0
            fi
            sleep 3
          done
          echo "❌ Healthcheck failed after 30s"
          docker logs $CID
          docker stop $CID
          exit 1

  # ──────────────────────────────────────────────────────────────
  # RELEASE BUILD
  # ──────────────────────────────────────────────────────────────
  release-build:
    name: Release Build (all targets)
    runs-on: ubuntu-latest
    needs: [rust-clippy, rust-test-lib, rust-test-integration, hl7-integration-test, prop-test, coverage, wasm-build, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build all release
        run: cargo build --release --workspace
      - name: Verify binaries
        run: |
          for bin in dmart-server; do
            ./target/release/$bin --version || ./target/release/$bin --help 2>&1 | head -1
          done
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: dmart-release-binaries
          path: |
            target/release/dmart-server
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # NOTIFY
  # ──────────────────────────────────────────────────────────────
  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs: [rust-fmt, rust-clippy, rust-test-lib, rust-test-integration, hl7-integration-test, prop-test, fuzz-test, coverage, wasm-build, e2e-test, security-audit, release-build]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          jobs=("rust-fmt" "rust-clippy" "rust-test-lib" "rust-test-integration" "hl7-integration-test" "prop-test" "fuzz-test" "coverage" "wasm-build" "docker-build" "e2e-test" "security-audit" "release-build")
          for job in "${jobs[@]}"; do
            result="${{ needs.$job.result }}"
            if [ "$result" = "success" ]; then
              echo "✅ $job" >> $GITHUB_STEP_SUMMARY
            elif [ "$result" = "failure" ]; then
              echo "❌ $job" >> $GITHUB_STEP_SUMMARY
            elif [ "$result" = "skipped" ]; then
              echo "⏭️ $job (skipped)" >> $GITHUB_STEP_SUMMARY
            else
              echo "❓ $job ($result)" >> $GITHUB_STEP_SUMMARY
            fi
          done