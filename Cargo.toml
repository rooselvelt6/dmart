[workspace]
members = [
    "dmart-shared",
    "dmart-server",
    "dmart-app",
    "dmart-server/fuzz",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.metadata]
cross = { target = "x86_64-unknown-linux-gnu" }

[workspace.package]
description = "dMart UCI - Sistema de Gestión de Unidad de Cuidados Intensivos"
authors = ["dMart Team"]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies.criterion]
version = "0.5"
features = ["html_reports"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
