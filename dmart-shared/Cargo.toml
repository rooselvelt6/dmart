[package]
name = "dmart-shared"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["chrono"]
chrono = ["dep:chrono", "utoipa/chrono"]
wasm-time = ["dep:js-sys", "dep:wasm-bindgen"]
ml-nn = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
linfa = { version = "0.7", features = ["default"] }
linfa-trees = { version = "0.7", features = ["default", "serde"] }
linfa-linear = { version = "0.7", features = ["serde"] }
linfa-datasets = { version = "0.7", features = ["default"] }
linfa-preprocessing = { version = "0.7", features = ["serde"] }
statrs = "0.17"
ndarray = "0.15"
ndarray-rand = "0.15"
rand = "0.8"
bincode = "1.3"
strum = { version = "0.27", features = ["derive"] }
sha2 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
bytemuck = "1.0"
anyhow = "1.0"
utoipa = { version = "5", features = ["uuid"], optional = true }
chrono = { version = "0.4", features = ["serde", "wasmbind"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.20", optional = true }
semver = { version = "1.0", features = ["serde"] }

[dev-dependencies]
criterion = { workspace = true }
proptest = "1.4"
