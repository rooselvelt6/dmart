[package]
name = "dmart-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
linfa = { version = "0.7", features = ["default"] }
linfa-trees = { version = "0.7", features = ["default", "serde"] }
linfa-linear = { version = "0.7", features = ["serde"] }
linfa-datasets = { version = "0.7", features = ["default"] }
linfa-preprocessing = { version = "0.7", features = ["serde"] }
ndarray = "0.15"
ndarray-rand = "0.15"
rand = "0.8"
bincode = "1.3"
strum = { version = "0.27", features = ["derive"] }

[dev-dependencies]
criterion = { workspace = true }
proptest = "1.4"
